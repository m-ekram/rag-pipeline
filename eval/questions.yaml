# Golden set for retrieval evaluation against the FastAPI documentation corpus
# (data/fastapi/, built by scripts/prepare_fastapi_docs.py).
#
#   question          what a user would actually type
#   relevant_sources  path suffix(es) that should be retrieved
#   must_contain      optional - the chunk must ALSO contain one of these
#                     strings, so "right file" alone does not count as a hit
#
# The set deliberately mixes three failure classes, because they break for
# different reasons and a number averaged over only one of them is misleading:
#
#   exact      names an identifier verbatim (UploadFile, root_path). Dense
#              search smooths identifiers away; BM25 is what saves these.
#   paraphrase describes the concept in the user's own words with little or no
#              lexical overlap. BM25 is useless here; embeddings carry it.
#   multihop   the answer lives in a section the question does not name, or
#              needs two facts joined.
#
# 36 questions. Tags are documentation only - the scorer ignores them.

# ---------------------------------------------------------------- exact ----
