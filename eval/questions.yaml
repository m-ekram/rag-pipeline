# Golden set for retrieval evaluation.
#
#   question          what a user would actually type
#   relevant_sources  path suffix(es) that should be retrieved
#   must_contain      optional - the chunk must also contain one of these
#                     strings, so "right file" alone does not count as a hit
#
# Aim for 30-50 entries on a real corpus. Include paraphrases, exact
# identifiers, and multi-hop questions - those three classes fail for different
# reasons and mixing them is what makes the number meaningful.

- question: How long does an access token stay valid?
  relevant_sources: [api-gateway.md]
  must_contain: ["3600"]

- question: What happens if a client reuses a refresh token?
  relevant_sources: [api-gateway.md]
  must_contain: ["ERR_TOKEN_REPLAY"]

- question: What is ERR_RATE_LIMITED?
  relevant_sources: [api-gateway.md]
  must_contain: ["ERR_RATE_LIMITED"]

- question: How many requests per minute does the Standard tier allow?
  relevant_sources: [api-gateway.md]
  must_contain: ["600"]

- question: Does the gateway retry POST requests automatically?
  relevant_sources: [api-gateway.md]
  must_contain: ["Idempotency-Key", "never retried"]

- question: What is the maximum size of a request body?
  relevant_sources: [api-gateway.md]
  must_contain: ["10 MB"]

- question: What happens to rate limiting when Redis goes down?
  relevant_sources: [api-gateway.md]
  must_contain: ["fails open", "fails closed"]

- question: Which environment variables must be set for a service to boot?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["DATABASE_URL"]

- question: How do I roll back a bad release?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["--immediate", "orbitctl deploy --tag"]

- question: When should we abandon a deploy and revert?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["Error rate above 2%", "p99 latency"]

- question: Are database migrations rolled back automatically?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["expand-then-contract", "not** rolled back", "not rolled back"]

- question: Why should healthz avoid checking the database?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["readyz", "out of rotation"]

- question: How many pod probe failures cause a restart?
  relevant_sources: [deployment-runbook.md]
  must_contain: ["ten consecutive"]

- question: What does bloom_bits_per_key control?
  relevant_sources: [storage-engine.md]
  must_contain: ["bloom_bits_per_key"]

- question: My writes keep stalling - what is going on?
  relevant_sources: [storage-engine.md]
  must_contain: ["level0_stall_trigger", "Write stalls"]

- question: Which wal_sync setting is safe against power loss?
  relevant_sources: [storage-engine.md]
  must_contain: ["always"]

- question: How do I take a backup without stopping the database?
  relevant_sources: [storage-engine.md]
  must_contain: ["snapshot create", "hard links"]

- question: What causes HAL_E_TOO_MANY_FILES?
  relevant_sources: [storage-engine.md]
  must_contain: ["max_open_files"]

- question: How should I tune the engine for a read-heavy workload?
  relevant_sources: [storage-engine.md]
  must_contain: ["block_cache_mb"]

- question: How long does restoring 500 GB take?
  relevant_sources: [storage-engine.md]
  must_contain: ["4 minutes per 100 GB"]
