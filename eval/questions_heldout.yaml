# HELD-OUT test set for retrieval evaluation - FastAPI docs corpus.
#
# Frozen before any further tuning and scored ONCE, at the end. Tune against
# eval/questions.yaml (the dev set); never against this file. The headline
# retrieval number comes from here, because nothing was fitted to it.
#
# How the pages were chosen (mechanical, so questions could not be steered
# toward what the system already retrieves well):
#   eligible = data/fastapi/*.md not referenced by the dev set, excluding
#              reference__* (autogenerated API stubs, 0-4 KB), *__index.md,
#              the empty how-to__testing-database.md, and non-technical pages
#              (contributing, help-fastapi, history-design-future, benchmarks,
#              alternatives, features, project-generation, editor-support,
#              index)                                          -> 67 pages
#   rng = random.Random(2026); pages = rng.sample(sorted(eligible), 50)
#   tags = 17 exact + 17 paraphrase + 16 multihop; rng.shuffle(tags)
#   page i gets tag i - assigned before the page was read.
#
# One question per page, written from that page's content. Same schema and
# rules as the dev set:
#   exact      names an identifier verbatim
#   paraphrase describes the need without quoting must_contain strings or the
#              page title (enforced by `--validate --strict`)
#   multihop   the answer lives in a section the question does not name, or
#              needs two facts joined
# relevant_sources lists the sampled page, plus another page only where it
# answers the question equally well.
#
# 50 questions: 91% needs 46/50.

