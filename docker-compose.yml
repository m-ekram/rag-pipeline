services:
  api:
    build: .
    image: rag-doc-qa:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - ./faiss_index:/app/faiss_index
      - cache:/app/.cache
    restart: unless-stopped

  # One-shot ingestion:  docker compose run --rm ingest
  ingest:
    build: .
    image: rag-doc-qa:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - ./faiss_index:/app/faiss_index
      - cache:/app/.cache
    command: ["python", "-m", "app.ingest", "--rebuild"]
    profiles: ["tools"]

  # Eval / benchmark / tests with the repo mounted:
  #   docker compose run --rm dev python -m eval.evaluate --compare
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rag-doc-qa-dev:latest
    working_dir: /work
    volumes:
      - .:/work
    environment:
      EMBED_PROVIDER: local
      PYTHONWARNINGS: ignore
      # Provenance for saved eval runs; set on the host before `docker compose run`.
      EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-}
      EVAL_GIT_DIRTY: ${EVAL_GIT_DIRTY:-}
    profiles: ["tools"]

volumes:
  cache:
