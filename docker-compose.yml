services:
  api:
    build: .
    image: rag-doc-qa:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./faiss_index:/app/faiss_index
      - cache:/app/.cache
    restart: unless-stopped

  # One-shot ingestion:  docker compose run --rm ingest
  ingest:
    build: .
    image: rag-doc-qa:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./faiss_index:/app/faiss_index
      - cache:/app/.cache
    command: ["python", "-m", "app.ingest", "--rebuild"]
    profiles: ["tools"]

volumes:
  cache:
